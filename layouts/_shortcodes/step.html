{{- $url := .Get "url" -}}
{{- $external := strings.HasPrefix $url "http" -}}
<div class="card step-card">
  <div class="card-info">
    {{ with .Get "number" }}<span class="step-number">{{ . }}</span>{{ end }}
    <p class="card-title">{{ .Get "title" }}</p>
    <p class="card-text">{{ .Inner | strings.TrimSpace | markdownify }}</p>
    {{ with $url }}
    <a class="step-button no-underline" href="{{ if $external }}{{ . }}{{ else }}{{ . | urls.RelURL }}{{ end }}"
       {{ if $external }}target="_blank" rel="noopener noreferrer"{{ end }}>
      {{ $.Get "button" }} &rarr;
    </a>
    {{ end }}
  </div>
</div>
